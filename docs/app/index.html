<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>BuckPi — Dimensional Analysis</title>
    <style>
      html, body {
        box-sizing: border-box;
        display: flow-root;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.6.0/katex.min.css?v=1.4.5" type="text/css" />
    <style>
        
:root {
  --buck-navy: #0b2d4d;
  --buck-blue: #126a9c;
  --buck-mid: #4e91b8;
  --buck-soft: #dcecf5;
  --buck-pale: #f3f4f6;
  --buck-line: #b9d4e4;
}
body { background: var(--buck-pale); color: var(--buck-navy); }
.bkpi-banner {
  overflow: hidden;
  border: 1px solid var(--buck-line);
  border-radius: 8px;
  background: white;
  box-shadow: 0 5px 18px rgba(11, 45, 77, 0.10);
}
.bkpi-banner-meta {
  padding: 6px 20px;
  background: var(--buck-soft);
  color: #416b86;
  font-size: 11px;
  letter-spacing: 0.05em;
  text-align: right;
}
.bkpi-brand {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 18px 24px 20px;
}
.bkpi-mark {
  display: flex;
  align-items: center;
  color: var(--buck-navy);
  font-family: "STIX Two Math", "Cambria Math", Georgia, serif;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}
.bkpi-mark .bkpi-pi { font-style: italic; }
.bkpi-mark .bkpi-pi { color: #0e5f91; font-size: 42px; }
.bkpi-brand h1 { color: var(--buck-navy); margin: 0; font-size: 34px; line-height: 1; }
.bkpi-brand p { color: #52738a; margin: 5px 0 0; font-size: 14px; }
.bkpi-intro {
  background: #e8f3f9;
  border-left: 5px solid var(--buck-blue);
  border-radius: 7px;
  color: #244f6b;
  line-height: 1.55;
  padding: 13px 18px;
}
.bkpi-intro p { margin: 0; }
.bkpi-error { background:#fff5f5; border-left:4px solid #b42318; color:#b42318; padding:12px 16px; border-radius:6px; }
.bkpi-variable-group {
  position: relative;
  border: 1px solid var(--buck-line);
  border-radius: 8px;
  padding: 18px 12px 10px;
  margin-top: 12px;
}
.bkpi-variable-group::before {
  position: absolute;
  top: -0.72em;
  left: 14px;
  padding: 0 7px;
  background: white;
  color: var(--buck-blue);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
}
.bkpi-output-group::before { content: "Output"; }
.bkpi-input-group::before { content: "Input"; }
@media (max-width: 620px) {
  .bkpi-brand { gap: 14px; padding: 16px; }
  .bkpi-mark { transform: scale(0.86); transform-origin: left center; margin-right: -8px; }
  .bkpi-brand h1 { font-size: 29px; }
}

    </style>
